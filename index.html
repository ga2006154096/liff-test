<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TanningFace 報名測試</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f7f9fa; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #user-info { font-size: 13px; color: #666; background: #eef9f2; padding: 8px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2>潛水練習報名測試</h2>
  <div id="user-info">載入用戶資料中...</div>

  <form id="bookingForm">
    <div class="form-group">
      <label>預約項目</label>
      <select id="item" required>
        <option value="">-- 請選擇 --</option>
        <option value="大武崙 15m 團練">大武崙 15m 團練</option>
        <option value="龍洞 25m 訓練潛">龍洞 25m 訓練潛</option>
      </select>
    </div>

    <div class="form-group">
      <label>學員姓名</label>
      <input type="text" id="name" required placeholder="請輸入中文姓名">
    </div>

    <div class="form-group">
      <label>電子郵件</label>
      <input type="email" id="email" required placeholder="example@gmail.com">
    </div>

    <button type="submit" id="submitBtn">送出報名</button>
  </form>
</div>

<script>
  // 替換為你的設定
  const LIFF_ID = "2012301088-rfXIxZuy"; 
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyPwMTZJZra6OtgN0kC3Z7fndhSzXxJOBeqGu4EgwBal9I_uy0-u8odlA4zkkKsiY16/exec"; 

  let userProfile = { userId: '', displayName: '' };

  async function initLIFF() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        userProfile = await liff.getProfile();
        document.getElementById('user-info').innerText = `已綁定 LINE：${userProfile.displayName}`;
      } else {
        liff.login();
      }
    } catch (err) {
      document.getElementById('user-info').innerText = `LIFF 初始化失敗或在外部瀏覽器開啟：${err.message}`;
    }
  }

  initLIFF();

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "資料送出中...";

    const payload = {
      userId: userProfile.userId,
      displayName: userProfile.displayName,
      item: document.getElementById('item').value,
      name: document.getElementById('name').value,
      email: document.getElementById('email').value
    };

    // 發送資料至 GAS API
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('預約成功！');
      if (liff.isInClient()) {
        liff.closeWindow(); // 若在 LINE 內開則自動關閉
      }
    })
    .catch(err => {
      alert('送出失敗，請重試：' + err);
      btn.disabled = false;
      btn.innerText = "送出報名";
    });
  });
</script>

</body>
</html>
