<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TanningFace 預約報名</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f7f9fa; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    .equipment-list { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .equipment-option { display: flex; align-items: center; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; }
    .equipment-option input[type="checkbox"] { margin-right: 10px; width: auto; }
    .equipment-option label { margin-bottom: 0; font-weight: normal; color: #333; cursor: pointer; flex: 1; }
    #other-equipment-input-group { margin-top: 10px; margin-bottom: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>潛水練習預約報名</h2>

  <form id="bookingForm">
    <div class="form-group">
      <label>預約項目 *</label>
      <select id="item" required>
        <option value="">-- 請選擇 --</option>
        <option value="大武崙 15m 團練">大武崙 15m 團練</option>
        <option value="龍洞 25m 訓練潛">龍洞 25m 訓練潛</option>
      </select>
    </div>

    <div class="form-group">
      <label>學員姓名 *</label>
      <input type="text" id="name" required placeholder="請輸入姓名">
    </div>

    <div class="form-group">
      <label>聯絡電話 *</label>
      <input type="tel" id="phone" required placeholder="0912345678">
    </div>

    <div class="form-group">
      <label>電子郵件 *</label>
      <input type="email" id="email" required placeholder="example@gmail.com">
    </div>

    <div class="form-group">
      <label>需要租借哪些裝備(防寒衣汰換中租金改為200)</label>
      <div id="equipment-options" class="equipment-list">
        <div class="equipment-option">
          <input type="checkbox" id="equip_no" value="否">
          <label for="equip_no">否</label>
        </div>
        <div class="equipment-option">
          <input type="checkbox" id="equip_1" value="面鏡呼吸管 (NT100)">
          <label for="equip_1">面鏡呼吸管 (NT100)</label>
        </div>
        <div class="equipment-option">
          <input type="checkbox" id="equip_2" class="need-size" value="長蛙鞋 (NT200)">
          <label for="equip_2">長蛙鞋 - 於下方填寫尺寸 (NT200)</label>
        </div>
        <div class="equipment-option">
          <input type="checkbox" id="equip_3" class="need-size" value="防寒衣配重帶 (NT200)">
          <label for="equip_3">防寒衣配重帶 - 於下方填寫身高體重 (NT200)</label>
        </div>
        <div class="equipment-option">
          <input type="checkbox" id="equip_4" value="全套裝備 (NT500)">
          <label for="equip_4">全套裝備 (NT500)</label>
        </div>
        <div class="equipment-option">
          <input type="checkbox" id="equip_other" class="need-size" value="其他">
          <label for="equip_other">其他</label>
        </div>
      </div>

      <div id="other-equipment-input-group" class="form-group hidden">
        <label style="color: #06C755;">請填寫租借尺寸 / 身高體重</label>
        <input type="text" id="other_equipment_text" placeholder="例：蛙鞋40碼 / 身高175體重70">
      </div>
    </div>

    <button type="submit" id="submitBtn">送出報名</button>
  </form>
</div>

<script>
  // 請填入你的 GAS Web App API 網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzuv8DvWmd7Sm6IANOWTeeQL4qWhazWHVdGd3yTYbOU0OrgjsBwLb-a9qpYRfHXfECi/exec"; 

  const equipNo = document.getElementById('equip_no');
  const otherInputGroup = document.getElementById('other-equipment-input-group');
  const otherInputText = document.getElementById('other_equipment_text');
  const allCheckboxes = document.querySelectorAll('#equipment-options input[type="checkbox"]');
  const sizeCheckboxes = document.querySelectorAll('.need-size');

  // 「否」互斥邏輯
  equipNo.addEventListener('change', function() {
    if (this.checked) {
      allCheckboxes.forEach(cb => {
        if (cb !== equipNo) {
          cb.checked = false;
          cb.disabled = true;
        }
      });
      otherInputGroup.classList.add('hidden');
      otherInputText.value = '';
    } else {
      allCheckboxes.forEach(cb => cb.disabled = false);
    }
  });

  // 自動展開備註欄位
  sizeCheckboxes.forEach(cb => {
    cb.addEventListener('change', function() {
      let needSize = Array.from(sizeCheckboxes).some(c => c.checked);
      if (needSize) {
        otherInputGroup.classList.remove('hidden');
      } else {
        otherInputGroup.classList.add('hidden');
        otherInputText.value = '';
      }
    });
  });

  // 表單送出
  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "資料送出中...";

    let selectedEquipment = [];
    allCheckboxes.forEach(cb => {
      if (cb.checked) selectedEquipment.push(cb.value);
    });

    const extraDetails = otherInputText.value.trim();
    if (extraDetails) {
      selectedEquipment.push(`[備註資訊: ${extraDetails}]`);
    }

    const payload = {
      item: document.getElementById('item').value,
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      equipment: selectedEquipment.length > 0 ? selectedEquipment.join(', ') : '未選擇'
    };

    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('預約成功！');
      document.getElementById('bookingForm').reset();
      btn.disabled = false;
      btn.innerText = "送出報名";
      otherInputGroup.classList.add('hidden');
      allCheckboxes.forEach(cb => cb.disabled = false);
    })
    .catch(err => {
      alert('送出失敗：' + err);
      btn.disabled = false;
      btn.innerText = "送出報名";
    });
  });
</script>

</body>
</html>
