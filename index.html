<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TanningFace 報名測試(更新版)</title>
  <!-- 載入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f7f9fa; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    h2 { margin-top: 0; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #06C755; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #user-info { font-size: 13px; color: #666; background: #eef9f2; padding: 8px; border-radius: 6px; margin-bottom: 15px; }
    /* 裝備複選框樣式 */
    .equipment-list { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .equipment-option { display: flex; align-items: center; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; transition: background 0.2s; }
    .equipment-option:hover { background: #f0fdf4; }
    .equipment-option.selected { background: #eef9f2; border-color: #06C755; }
    .equipment-option input[type="checkbox"] { margin-right: 10px; width: auto; }
    .equipment-option label { margin-bottom: 0; font-weight: normal; color: #333; cursor: pointer; flex: 1; }
    .equipment-option label span { font-size: 13px; color: #666; display: block; }
    #other-equipment-input-group { margin-top: 10px; margin-bottom: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>潛水練習報名測試</h2>
  <div id="user-info">載入用戶資料中...</div>

  <form id="bookingForm">
    <div class="form-group">
      <label>預約項目</label>
      <select id="item" required>
        <option value="">-- 請選擇 --</option>
        <option value="大武崙 15m 團練">大武崙 15m 團練</option>
        <option value="龍洞 25m 訓練潛">龍洞 25m 訓練潛</option>
      </select>
    </div>

    <div class="form-group">
      <label>學員姓名</label>
      <input type="text" id="name" required placeholder="請輸入中文姓名">
    </div>

    <div class="form-group">
      <label>電子郵件</label>
      <input type="email" id="email" required placeholder="example@gmail.com">
    </div>

    <!-- 新增：裝備租借複選題 (直接在 HTML 中定義) -->
    <div class="form-group">
      <label>需要租借哪些裝備(防寒衣汰換中租金改為200)</label>
      <div id="equipment-options" class="equipment-list">
        <div class="equipment-option" id="opt-no">
          <input type="checkbox" id="equip_no" value="否">
          <label for="equip_no">否</label>
        </div>
        <div class="equipment-option" id="opt-1">
          <input type="checkbox" id="equip_1" value="面鏡呼吸管 (NT100)">
          <label for="equip_1">面鏡呼吸管 (NT100)</label>
        </div>
        <div class="equipment-option" id="opt-2">
          <input type="checkbox" id="equip_2" value="長蛙鞋 - 於其他選項欄留下尺寸 (NT200)">
          <label for="equip_2">長蛙鞋 - 於其他選項欄留下尺寸 (NT200)</label>
        </div>
        <div class="equipment-option" id="opt-3">
          <input type="checkbox" id="equip_3" value="防寒衣配重帶 - 於其他選項欄留下身高體重 (NT200)">
          <label for="equip_3">防寒衣配重帶 - 於其他選項欄留下身高體重 (NT200)</label>
        </div>
        <div class="equipment-option" id="opt-4">
          <input type="checkbox" id="equip_4" value="全套裝備 (NT500)">
          <label for="equip_4">全套裝備 (NT500)</label>
        </div>
        <div class="equipment-option" id="opt-other">
          <input type="checkbox" id="equip_other" value="其他">
          <label for="equip_other">其他</label>
        </div>
      </div>
      <!-- 用於「其他」輸入的隱藏文本欄位 -->
      <div id="other-equipment-input-group" class="form-group hidden">
        <label>其他(請填寫尺寸或身高體重)</label>
        <input type="text" id="other_equipment_text" placeholder="如：蛙鞋40碼/防寒衣M號">
      </div>
    </div>

    <button type="submit" id="submitBtn">送出報名</button>
  </form>
</div>

<script>
  // 替換為你的設定
  const LIFF_ID = "2012301088-rfXIxZuy"; 
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyPwMTZJZra6OtgN0kC3Z7fndhSzXxJOBeqGu4EgwBal9I_uy0-u8odlA4zkkKsiY16/exec"; 

  let userProfile = { userId: '', displayName: '' };

  async function initLIFF() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        userProfile = await liff.getProfile();
        document.getElementById('user-info').innerText = `已綁定 LINE：${userProfile.displayName}`;
      } else {
        liff.login();
      }
    } catch (err) {
      document.getElementById('user-info').innerText = `LIFF 初始化失敗或在外部瀏覽器開啟：${err.message}`;
    }
  }

  initLIFF();

  // 處理裝備複選框邏輯
  const equipNo = document.getElementById('equip_no');
  const equipOther = document.getElementById('equip_other');
  const otherInputGroup = document.getElementById('other-equipment-input-group');
  const otherInputText = document.getElementById('other_equipment_text');
  const otherCheckboxes = document.querySelectorAll('#equipment-options input[type="checkbox"]:not(#equip_no)');

  equipNo.addEventListener('change', function() {
    if (this.checked) {
      // 如果選擇「否」，則取消選擇所有其他裝備並禁用
      otherCheckboxes.forEach(cb => {
        cb.checked = false;
        cb.disabled = true;
        // 同步取消其他隱藏輸入框
        otherInputGroup.classList.add('hidden');
        otherInputText.value = '';
      });
    } else {
      // 取消選擇「否」，重新啟用其他裝備
      otherCheckboxes.forEach(cb => {
        cb.disabled = false;
      });
    }
  });

  equipOther.addEventListener('change', function() {
    // 只有在選中「其他」時才顯示文本輸入框
    if (this.checked) {
      otherInputGroup.classList.remove('hidden');
    } else {
      otherInputGroup.classList.add('hidden');
      otherInputText.value = ''; // 清空輸入
    }
  });

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "資料送出中...";

    // 收集選中的裝備
    let selectedEquipment = [];
    const checkboxes = document.querySelectorAll('#equipment-options input[type="checkbox"]');
    checkboxes.forEach(cb => {
      if (cb.checked) {
        let val = cb.value;
        if (val === '其他') {
          // 如果選中「其他」，則附加文本輸入
          const otherText = document.getElementById('other_equipment_text').value;
          if (otherText) {
            val += ` (${otherText})`;
          } else {
            val += ' (未填寫尺寸/身高體重)';
          }
        }
        selectedEquipment.push(val);
      }
    });

    const payload = {
      userId: userProfile.userId,
      displayName: userProfile.displayName,
      item: document.getElementById('item').value,
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      equipment: selectedEquipment.join(', ') // 將數組串聯成字符串
    };

    // 發送資料至 GAS API
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      alert('預約成功！');
      if (liff.isInClient()) {
        liff.closeWindow(); // 若在 LINE 內開則自動關閉
      }
    })
    .catch(err => {
      alert('送出失敗，請重試：' + err);
      btn.disabled = false;
      btn.innerText = "送出報名";
    });
  });
</script>

</body>
</html>
